        lineCount.total++;
        let m = line.match(HEAD_RE);
        let isHead = false, num, rest;
        if (m) {
          num = m[1]; rest = m[2];
          const top = parseInt(num.split('.')[0], 10);
          // reject things that look like quantities ("2 days", "30 % of")
          const looksQty = /^(%|per|days?|months?|weeks?|years?|nos?|m2|m3|mm|kg|aed|usd|x\b)/i.test(rest);
          const plausible = top <= 300 && !looksQty && (num.includes('.') || top <= lastTop + 3 || lastTop === 0);
          if (plausible) { isHead = true; }
        } else if ((m = line.match(HEAD_ONLY_RE))) { isHead = true; num = m[1]; rest = ''; }
        if (isHead) {
          if (cur.lines.length || cur.num !== '0') clauses.push(cur);
          const top = parseInt(num.split('.')[0], 10); if (!num.includes('.')) lastTop = top; else lastTop = Math.max(lastTop, top);
          let title = rest, body = [];
          const isTitle = rest.length <= 90 && !/[.;:]$/.test(rest) && rest.split(' ').length <= 12;
          if (!isTitle && rest) { title = rest.split(/\s+/).slice(0, 8).join(' ') + '…'; body = [rest]; }
          cur = { num, title: title.replace(/[:\-–]\s*$/, ''), lines: body, page: pg.n, titleDerived: !isTitle };
        } else {
          cur.lines.push(line);
        }
      }
    }
    if (cur.lines.length || cur.num !== '0') clauses.push(cur);
    // Merge empty heading clauses into their children (e.g. "6. Payment" followed by "6.1 ...")
    const parentTitle = {};
    const kept = [];
    for (let i = 0; i < clauses.length; i++) {
      const c = clauses[i], nx = clauses[i + 1];
      if (!c.lines.length && nx && nx.num.startsWith(c.num + '.')) { parentTitle[c.num] = c.title; continue; }
      kept.push(c);
    }
    kept.forEach(c => {
      const parts = c.num.split('.'); let pt = '';
      for (let k = parts.length - 1; k > 0; k--) { const key = parts.slice(0, k).join('.'); if (parentTitle[key]) { pt = parentTitle[key]; break; } }
      c.parentTitle = pt;
      if (c.titleDerived && pt) { c.title = pt; c.titleDerived = false; }
    });
    const out = kept.map((c, i) => {
      const text = c.lines.join(' ').replace(/\s+/g, ' ').trim();
      const cls = classify((c.parentTitle ? c.parentTitle + ' ' : '') + c.title, text);
      return {
        id: 'c' + i + '_' + c.num.replace(/\./g, '_'),
        num: c.num, title: c.title, parentTitle: c.parentTitle || '', text, page: c.page,
        level: c.num.split('.').length, primary: cls.primary, topics: cls.topics,
        values: extractValues(text), words: text ? text.split(/\s+/).length : 0
      };
    }).filter(c => c.text || c.num !== '0');
    return { clauses: out, stats: { lines: lineCount.total, clauses: out.length } };
  }

  // ---------- Word-level diff (LCS) ----------
  function diffWords(a, b) {
    const A = norm(a).split(/\s+/).filter(Boolean), B = norm(b).split(/\s+/).filter(Boolean);
    const n = A.length, m = B.length;
    if (n * m > 1500000) return [{ op: 'del', t: A.join(' ') }, { op: 'ins', t: B.join(' ') }];
    const key = w => w.toLowerCase().replace(/[^a-z0-9%]/g, '');
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = key(A[i]) === key(B[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ops = []; let i = 0, j = 0;
    const push = (op, t) => { const l = ops[ops.length - 1]; if (l && l.op === op) l.t += ' ' + t; else ops.push({ op, t }); };
    while (i < n && j < m) {
      if (key(A[i]) === key(B[j])) { push('eq', B[j]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { push('del', A[i]); i++; }
      else { push('ins', B[j]); j++; }
    }
    while (i < n) push('del', A[i++]);
    while (j < m) push('ins', B[j++]);
    return ops;
  }
  function diffSummary(ops) {
    const del = ops.filter(o => o.op === 'del').map(o => o.t), ins = ops.filter(o => o.op === 'ins').map(o => o.t);
    const parts = [];
    if (del.length) parts.push('Removed: "' + del.join('" / "').slice(0, 400) + '"');
    if (ins.length) parts.push('Added: "' + ins.join('" / "').slice(0, 400) + '"');
    return parts.join('. ') || 'No wording difference.';
  }

  // ---------- Matching ----------
  function clauseVec(c) { return tf(contentWords(c.title + ' ' + c.text)); }
  function textSim(a, b) { return cosine(tf(contentWords(a.text || a.title)), tf(contentWords(b.text || b.title))); }
  function matchClauses(base, prop) {
    const bv = base.map(clauseVec), pv = prop.map(clauseVec);
    const bt = base.map(c => tf(contentWords(c.title))), pt = prop.map(c => tf(contentWords(c.title)));
    const cand = [];
    for (let i = 0; i < base.length; i++) for (let j = 0; j < prop.length; j++) {
      const s = cosine(bv[i], pv[j]);
      const st = cosine(bt[i], pt[j]);
      const sameNum = base[i].num === prop[j].num ? 1 : 0;
      const sameTopic = base[i].primary === prop[j].primary ? 1 : 0;
      const score = 0.62 * s + 0.2 * st + 0.08 * sameNum + 0.1 * sameTopic;
      if (score >= 0.3) cand.push({ i, j, score, s });
    }
    cand.sort((a, b) => b.score - a.score);
    const usedB = new Set(), usedP = new Set(), pairs = [];
    for (const c of cand) { if (usedB.has(c.i) || usedP.has(c.j)) continue; usedB.add(c.i); usedP.add(c.j); pairs.push(c); }
    return { pairs, unmatchedBase: base.map((_, i) => i).filter(i => !usedB.has(i)), unmatchedProp: prop.map((_, j) => j).filter(j => !usedP.has(j)) };
  }

  // ---------- Internal conflicts (within a document) ----------
  const KEY_PARAM_TOPICS = ['ld', 'retention', 'payment', 'liability', 'defects', 'bond', 'advance', 'claims', 'eot'];
  function paramFor(topicId, vals) {
    const t = TOPIC_BY_ID[topicId]; if (!t || !t.unit) return null;
    const v = vals.filter(x => x.unit === t.unit);
    return v.length ? v[0] : null;
  }
  function internalConflicts(clauses) {
    const conflicts = [];
    for (const tid of KEY_PARAM_TOPICS) {
      const t = TOPIC_BY_ID[tid];
      const holders = clauses.filter(c => c.primary === tid).map(c => ({ c, p: paramFor(tid, c.values) })).filter(x => x.p);
      const distinct = [...new Set(holders.map(h => h.p.v))];
      if (distinct.length > 1) conflicts.push({ topic: tid, name: t.name, unit: t.unit, items: holders.map(h => ({ num: h.c.num, page: h.c.page, value: h.p.v, raw: h.p.raw, id: h.c.id })) });
    }
    return conflicts;
  }

  // ---------- Flags ----------
  function detectFlags(text) { return FLAGS.filter(f => f.re.test(text || '')).map(f => ({ id: f.id, label: f.label, disadv: f.disadv, w: f.w, note: f.note || '' })); }

  // ---------- Perspective logic ----------
  const PARTY = { MC: 'Main Contractor', SC: 'Subcontractor', N: 'Neutral' };
  const MITIGATION = {
    payment: 'fix a definite certification and payment period and remove conditional payment wording',
    retention: 'hold retention at the baseline rate and cap, with release tied to completion and defects expiry',
    bond: 'require a performance bond in the baseline form and amount, valid until completion/defects expiry',
    ld: 'state one delay-damages rate and cap only, aligned to the upstream exposure',
    liability: 'retain baseline liability; any cap should be not less than the subcontract price and must carve out fraud, wilful default, indemnities and insured losses',
    indemnity: 'reinstate baseline indemnity scope',
    claims: 'align notice periods so the Main Contractor can notify upstream within its own time limits',
    eot: 'keep EOT entitlement tied to the baseline relief events and notice procedure',
    variations: 'keep the baseline instruction and valuation procedure',
    defects: 'match the defects period to the upstream Defects Notification Period',
    termination: 'reinstate baseline termination grounds and consequences',
    advance: 'tie advance recovery to the baseline percentage and secure it with an advance payment guarantee',
    insurance: 'reinstate baseline insurance cover, limits and naming of insured parties'
  };
  function rateChange(kind, topicId, perspective, opts) {
    // kind: 'missing'|'additional'|'value'|'wording'|'conflict'|'matched'
    const t = TOPIC_BY_ID[topicId] || { weight: 1, protects: 'BOTH', name: 'General' };
    let disadv = null, favour = null, sev = 'LOW', why = [];
    const P = perspective;
    if (kind === 'matched') return { sev: 'COMPLIANT', disadv: null, why: ['Wording consistent with baseline.'] };
    if (kind === 'missing') {
      disadv = t.protects === 'BOTH' ? null : t.protects;
      why.push('Baseline clause on ' + t.name.toLowerCase() + ' has no counterpart in the proposed document.');
    }
    if (kind === 'value' && opts && opts.change) {
      const ch = opts.change;
      if (t.higherFavours) {
        favour = ch.to > ch.from ? t.higherFavours : (t.higherFavours === 'MC' ? 'SC' : 'MC');
        disadv = favour === 'MC' ? 'SC' : 'MC';
      }
      why.push(t.name + ' parameter changed from ' + ch.fromRaw + ' to ' + ch.toRaw + '.');
    }
    if (kind === 'conflict') why.push('The proposed document states inconsistent values for ' + t.name.toLowerCase() + '.');
    let w = t.weight;
    // phrase flags newly introduced
    const flags = (opts && opts.newFlags) || [];
    for (const f of flags) {
      why.push('Introduces: ' + f.label + '.');
      if (f.disadv) { if (!disadv) disadv = f.disadv; w = Math.max(w, f.w); }
      else w = Math.max(w, f.w - 1);
    }
    if (kind === 'conflict') { sev = w >= 3 ? 'CRITICAL' : 'HIGH'; }
    else if (P === 'N') {
      sev = disadv ? sevFromWeight(w - 1 + (opts && opts.bigShift ? 1 : 0)) : (kind === 'wording' ? (opts && opts.sim >= 0.85 ? 'LOW' : 'MEDIUM') : sevFromWeight(w - 2));
      if (kind === 'missing' && !disadv) sev = sevFromWeight(w - 1);
    } else if (disadv === P) {
      sev = sevFromWeight(w + (opts && opts.bigShift ? 1 : 0));
    } else if (disadv && disadv !== P) {
      sev = 'LOW'; why.push('Change is favourable to the ' + PARTY[P] + '.');
    } else {
      // undirected
      if (kind === 'missing') sev = sevFromWeight(w - 1);
      else if (kind === 'additional') sev = flags.length ? sevFromWeight(w - 1) : 'LOW';
      else sev = (opts && opts.sim >= 0.85) ? 'LOW' : sevFromWeight(Math.max(1, w - 1));
    }
    if (kind === 'wording' && !flags.length) why.push('Wording revised (content similarity ' + Math.round(((opts && opts.sim) || 0) * 100) + '%) with no change to stated values; confirm the revised meaning.');
    if (kind === 'additional' && !flags.length && why.length === 0) why.push('Clause not present in the baseline; review intent and interaction with baseline terms.');
    return { sev, disadv, why };
  }
  function recommend(sev, disadv, kind, topicId, perspective, baseRef) {
    const t = TOPIC_BY_ID[topicId] || { name: 'this subject' };
    const mit = MITIGATION[topicId] ? ' Fallback position: ' + MITIGATION[topicId] + '.' : '';
    const ref = baseRef ? 'baseline Clause ' + baseRef : 'the baseline position';
    const rec = {};
    // Main Contractor view
    if (kind === 'matched') { rec.MC = rec.SC = rec.N = 'No action required.'; return rec; }
    if (disadv === 'MC') rec.MC = (kind === 'missing' ? 'Reinstate ' + ref + '.' : 'Reject the change and reinstate ' + ref + '.') + mit;
    else if (disadv === 'SC') rec.MC = 'Change is favourable to the Main Contractor. Confirm it is consistent with the upstream Main Contract and obtain confirmation of enforceability before accepting.';
    else rec.MC = kind === 'additional' ? 'Clarify the purpose of the added clause; accept only if consistent with the baseline risk allocation and upstream obligations.' : 'Review the revised wording against ' + ref + ' and confirm no change to risk allocation.';
    if (disadv === 'SC') rec.SC = 'Resist the change; propose ' + ref + ' or a balanced compromise.' + mit;
    else if (disadv === 'MC') rec.SC = 'Change is favourable to the Subcontractor. Expect the Main Contractor to resist; prepare commercial justification or a trade-off.';
    else rec.SC = 'Confirm interpretation in writing and price any residual risk.';
    rec.N = (disadv ? 'Shifts risk on ' + t.name.toLowerCase() + ' toward the ' + PARTY[disadv] + '. ' : '') +
      (sev === 'CRITICAL' || sev === 'HIGH' ? 'Parties should agree wording before execution; refer to qualified legal review where enforceability is in question.' : 'Agree wording during negotiation and record in the agreed deviation register.');
    return rec;
  }
  function priority(sev) { return { CRITICAL: 'P1 – Must resolve before signing', HIGH: 'P2 – Negotiate', MEDIUM: 'P3 – Clarify', LOW: 'P4 – Note', COMPLIANT: '-' }[sev] || '-'; }
  function approvalFor(sev) { return { CRITICAL: 'Company Authorisation + qualified legal review', HIGH: 'Commercial Manager + Contracts Manager', MEDIUM: 'Contracts Manager', LOW: 'Quantity Surveyor', COMPLIANT: 'None' }[sev] || 'None'; }
  const COMMERCIAL_IMPACT = {
    payment: 'Cash-flow timing and working-capital exposure.', retention: 'Security held against defects; cash-flow effect on the Subcontractor.', bond: 'Security available against non-performance.',
    ld: 'Recovery of delay costs and pass-through of upstream delay damages.', liability: 'Maximum recoverable loss.', indemnity: 'Allocation of third-party and loss exposure.',
    variations: 'Recovery of changed scope.', claims: 'Ability to recover time and money; time-bar exposure.', eot: 'Exposure to delay damages.', advance: 'Advance exposure and recovery profile.',
    defects: 'Duration of remedial obligation and retention release.', insurance: 'Uninsured loss exposure.', termination: 'Exit rights and termination costs.', backcharge: 'Ability to recover costs from the other party.',
    finalaccount: 'Timing of final settlement.', scope: 'Price adequacy and scope gaps.', exclusions: 'Scope gaps and interface cost.', price: 'Contract sum basis.'
  };

  // ---------- Main comparison ----------
  function compare(baseDoc, propDoc, perspective) {
    const base = baseDoc.clauses || [], prop = propDoc.clauses || [];
    const P = perspective || 'N';
    const { pairs, unmatchedBase, unmatchedProp } = matchClauses(base, prop);
    const rows = [];
    const propConflicts = internalConflicts(prop);
    const conflictIds = new Set(); propConflicts.forEach(c => c.items.forEach(it => conflictIds.add(it.id)));

    for (const pr of pairs) {
      const b = base[pr.i], p = prop[pr.j];
      const sim = textSim(b, p);
      const identical = norm(b.text).toLowerCase() === norm(p.text).toLowerCase();
      const bSig = valueSig(b.values), pSig = valueSig(p.values);
      const topic = b.primary !== 'general' ? b.primary : p.primary;
      let status, kind, change = null;
      const bFlags = detectFlags(b.text).map(f => f.id), newFlags = detectFlags(p.text).filter(f => !bFlags.includes(f.id));
      if (identical) { status = 'MATCHED'; kind = 'matched'; }
      else if (bSig !== pSig) {
        status = 'MODIFIED'; kind = 'value';
        const t = TOPIC_BY_ID[topic];
        const unit = t && t.unit;
        const bp = unit ? b.values.find(v => v.unit === unit) : b.values[0];
        const pp = unit ? p.values.find(v => v.unit === unit) : p.values[0];
        if (bp && pp && bp.v !== pp.v) change = { unit: bp.unit, from: bp.v, to: pp.v, fromRaw: bp.raw, toRaw: pp.raw };
        else if (bp && !pp) { kind = 'wording'; }
      } else if (sim >= 0.985) { status = 'MATCHED'; kind = 'matched'; }
      else if (sim >= 0.85 && !newFlags.length) { status = 'PARTIALLY MATCHED'; kind = 'wording'; }
      else { status = 'MODIFIED'; kind = 'wording'; }
      if (conflictIds.has(p.id)) { status = 'CONFLICTING'; kind = 'conflict'; }
      const ambiguous = pr.score < 0.45;
      if (ambiguous && status !== 'MATCHED') status = 'REQUIRES REVIEW';
      const bigShift = change && change.from > 0 ? (change.to / change.from >= 2 || change.to / change.from <= 0.5) : (change ? true : false);
      const r = rateChange(kind === 'value' && !change ? 'wording' : kind, topic, P, { change, newFlags, sim, bigShift });
      if (b.num === '0' && p.num === '0' && kind !== 'conflict' && !newFlags.length) { r.sev = 'LOW'; r.why = ['Title / preamble wording differs.']; }
      const ops = identical ? [] : diffWords(b.text, p.text);
      rows.push(mkRow({ status, topic, b, p, ops, sim, matchScore: pr.score, r, kind, P, change, newFlags }));
    }
    for (const i of unmatchedBase) {
      const b = base[i];
      const r = rateChange('missing', b.primary, P, {});
      rows.push(mkRow({ status: 'MISSING', topic: b.primary, b, p: null, ops: [{ op: 'del', t: b.text }], sim: 0, matchScore: 0, r, kind: 'missing', P }));
    }
    for (const j of unmatchedProp) {
      const p = prop[j];
      const newFlags = detectFlags(p.text);
      let kind = 'additional', status = 'ADDITIONAL';
      if (conflictIds.has(p.id)) { status = 'CONFLICTING'; kind = 'conflict'; }
      const r = rateChange(kind, p.primary, P, { newFlags });
      rows.push(mkRow({ status, topic: p.primary, b: null, p, ops: [{ op: 'ins', t: p.text }], sim: 0, matchScore: 0, r, kind, P, newFlags }));
    }
    // order by baseline clause number then proposed
    const numKey = n => (n || '999').split('.').map(x => String(parseInt(x, 10) || 0).padStart(4, '0')).join('.');
    rows.sort((a, b) => numKey(a.baseNum || a.propNum).localeCompare(numKey(b.baseNum || b.propNum)));
    rows.forEach((r, i) => { r.sn = i + 1; });
    // conflict descriptions
    for (const c of propConflicts) {
      for (const it of c.items) {
        const row = rows.find(r => r.propId === it.id);
        if (row) row.commentary = 'Internal conflict: the proposed document states ' + c.name.toLowerCase() + ' as ' + c.items.map(x => x.raw + ' (Cl. ' + x.num + ', p.' + x.page + ')').join(' and ') + '. ' + row.commentary;
      }
    }
    // Mandatory subject coverage
    const covered = new Set(base.map(c => c.primary)), coveredP = new Set(prop.map(c => c.primary));
    const coverage = TOPICS.map(t => ({ id: t.id, name: t.name, inBase: covered.has(t.id), inProp: coveredP.has(t.id) }));
    return { rows, conflicts: propConflicts, coverage, scores: score(rows, base.length, baseDoc, propDoc), perspective: P };
  }

  function mkRow({ status, topic, b, p, ops, sim, matchScore, r, kind, P, change, newFlags }) {
    const t = TOPIC_BY_ID[topic];
    const recs = recommend(r.sev, r.disadv, kind, topic, P, b && b.num);
    const amendWanted = r.sev !== 'COMPLIANT' && r.sev !== 'LOW' && b && (r.disadv === P || (P === 'N' && r.disadv) || kind === 'missing' || kind === 'conflict');
    return {
      sn: 0, topic, topicName: t ? t.name : 'General',
      baseId: b ? b.id : null, propId: p ? p.id : null,
      baseNum: b ? b.num : '', propNum: p ? p.num : '',
      baseTitle: b ? b.title : '', propTitle: p ? p.title : '',
      basePage: b ? b.page : '', propPage: p ? p.page : '',
      baseText: b ? b.text : '', propText: p ? p.text : '',
      status, severity: r.sev, disadvantaged: r.disadv,
      similarity: round(sim, 3), matchScore: round(matchScore, 3),
      diff: ops, difference: status === 'MATCHED' ? 'No difference' : (status === 'MISSING' ? 'Clause absent from proposed document' : status === 'ADDITIONAL' ? 'Clause added in proposed document' : diffSummary(ops)),
      change: change || null, flags: (newFlags || []).map(f => f.label),
      commercialImpact: status === 'MATCHED' ? 'None identified' : (COMMERCIAL_IMPACT[topic] || 'Review commercial effect.'),
      contractualImpact: r.why.join(' '),
      commentary: r.why.join(' '),
      recommendations: recs,
      recommendation: recs[P],
      amendment: amendWanted ? b.text : '',
      amendmentSource: amendWanted ? 'SYSTEM-GENERATED: reinstated baseline wording (Clause ' + b.num + '). Not existing contract text of the proposed document.' : '',
      priority: priority(r.sev), approval: approvalFor(r.sev),
      responsible: '', reviewStatus: 'Not reviewed', approvalStatus: 'Pending'
    };
  }

  // ---------- Scoring (method shown in UI) ----------
  const STATUS_WEIGHT = { 'MATCHED': 1, 'PARTIALLY MATCHED': 0.75, 'MODIFIED': 0.4, 'REQUIRES REVIEW': 0.25, 'CONFLICTING': 0, 'MISSING': 0 };
  function score(rows, baseCount, baseDoc, propDoc) {
    const counts = {}; rows.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
    const sev = {}; rows.forEach(r => { sev[r.severity] = (sev[r.severity] || 0) + 1; });
    const baseRows = rows.filter(r => r.baseId);
    const alignment = baseRows.length ? baseRows.reduce((s, r) => s + (STATUS_WEIGHT[r.status] ?? 0), 0) / baseRows.length : 0;
    const clauseAlign = baseCount ? (counts['MATCHED'] || 0) / baseCount : 0;
    const matched = rows.filter(r => r.baseId && r.propId);
    const matchConf = matched.length ? matched.reduce((s, r) => s + r.matchScore, 0) / matched.length : 0;
    const ex = d => (d && d.extraction) ? d.extraction : null;
    return {
      alignment: round(alignment * 100, 1), clauseAlignment: round(clauseAlign * 100, 1), counts, severity: sev,
      matchingConfidence: round(matchConf * 100, 1), baseExtraction: ex(baseDoc), propExtraction: ex(propDoc),
      unreviewed: rows.filter(r => r.reviewStatus === 'Not reviewed' && r.severity !== 'COMPLIANT').length,
      method: 'Overall alignment = average over baseline clauses of a status weight (Matched 1.00, Partially matched 0.75, Modified 0.40, Requires review 0.25, Conflicting 0, Missing 0). Clause alignment = baseline clauses with identical wording ÷ baseline clauses. Matching confidence = mean clause-pair match score (0.62 × content-word cosine similarity + 0.20 × title similarity + 0.08 × same clause number + 0.10 × same topic). Extraction confidence = pages with an extractable text layer (or OCR result) ÷ total pages. These scores measure textual alignment with the selected baseline only; they are not a statement of legal enforceability.'
    };
  }

  // ---------- Obligation extraction ----------
  const PARTY_RE = /\b(the )?(sub-?contractor|main contractor|contractor|employer|engineer|consultant|client|owner)\b/i;
  function extractObligations(clauses) {
    const out = [];
    for (const c of clauses) {
      const sents = c.text.split(/(?<=[.;])\s+(?=[A-Z(])/);
      for (const s of sents) {
        if (!/\bshall\b|\bmust\b/i.test(s)) continue;
        const timeM = s.match(/(within|not later than|no later than|at least|prior to|before)\s+([^,.;]{0,40}?\b(\d{1,4})\b[^,.;]{0,12}?(days?|weeks?|months?))/i);
        const isNotice = /notice|notify|notif/i.test(s);
        if (!timeM && !isNotice) continue;
        const before = s.split(/\bshall\b|\bmust\b/i)[0];
        const pm = before.match(PARTY_RE) || s.match(PARTY_RE);
        const tail = timeM ? s.slice(timeM.index + timeM[0].length) : s;
        const trig = tail.match(/^\s*(?:after|of|from|following|upon)\s+(?:the\s+)?([^,.;]{4,80}?)(?:[,.;]|$)/i);
        const period = timeM ? parseInt(timeM[3], 10) : null;
        const unit = timeM ? timeM[4].toLowerCase().replace(/s$/, '') : null;
        out.push({
          clause: c.num, page: c.page, topic: c.primary,
          party: pm ? pm[2].replace(/^sub-?contractor$/i, 'Subcontractor').replace(/^main contractor$/i, 'Main Contractor').replace(/^\w/, x => x.toUpperCase()) : 'Not stated',
          description: norm(s).slice(0, 400), type: isNotice ? 'Notice' : 'Time obligation',
          period, unit, trigger: trig ? norm(trig[1]) : '', calendarBasis: /working|business/i.test(s) ? 'Working days' : /calendar/i.test(s) ? 'Calendar days' : (unit === 'day' ? 'Not stated' : '')
        });
      }
    }

async function callClaude(system, instruction, maxTokens, data) {

  if (!S.settings.allowAI[cid()]) throw new Error('External AI processing is not authorised for this company. A Company Administrator can authorise it in Settings → AI processing.');

  if (recent >= (Number(S.settings.aiRateLimit) || 10)) throw new Error('AI rate limit reached (' + S.settings.aiRateLimit + ' requests per minute). Try again shortly.');

    if (viaServer) { const j = await api('/ai', { body: { system, content, max_tokens: maxTokens || 1500, model: S.settings.model, companyId: cid() } }); metric('ai', true, performance.now() - t0, S.settings.model, { tokensIn: (j.usage || {}).input_tokens || 0, tokensOut: (j.usage || {}).output_tokens || 0 }); return { text: j.text, validation: Q.validateAIOutput(j.text, [instr, payload]) }; }

    metric('ai', true, performance.now() - t0, S.settings.model, { tokensIn: j.usage ? j.usage.input_tokens : 0, tokensOut: j.usage ? j.usage.output_tokens : 0 });
    audit('AI request', 'ai', (S.settings.model || '') + (j.usage ? ' – ' + j.usage.output_tokens + ' output tokens' : '')); save();

let dlNs;
function downloadsNs() { if (dlNs === undefined) dlNs = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null); return dlNs; }
async function deliver(blob, name) {
  const ns = await downloadsNs();
  if (ns) {
    const fn = /\.(sql)$/i.test(name) ? name + '.txt' : name;
    try { await ns.save({ filename: fn, data: blob }); audit('Exported', 'file', fn); save(); return true; }
    catch (e) { if (e && e.code !== 'declined') toast('Could not save ' + fn + ' here (' + (e.code || e.message) + '). The standalone HTML file can download it directly.', true); return false; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  audit('Exported', 'file', name); save(); return true;
}
// qa: optional async (blob) => {ok, checks:[{name, ok, detail, level}]}
async function saveBlob(blob, name, qa) {
  const t0 = performance.now();
  let rep = null;
  if (!qa && typeof exportQA === 'function') { const ext = String(name).split('.').pop().toLowerCase(); if (['docx', 'xlsx', 'pdf', 'pptx'].includes(ext)) qa = b => exportQA(ext, b, null); }
  if (qa) { try { rep = await busy('Checking ' + name + '…', () => qa(blob)); } catch (e) { rep = { ok: false, checks: [{ name: 'Quality check could not run', ok: false, level: 'fail', detail: e.message }] }; } }
  if (rep) { S.exportLog.unshift({ at: nowIso(), companyId: cid(), name, ok: rep.ok, size: blob.size, checks: rep.checks }); S.exportLog.length = Math.min(S.exportLog.length, 200); metric('export', rep.ok, performance.now() - t0, name, { size: blob.size }); save(); }
  if (rep && !rep.ok) {
    const go = await ask('Export quality check failed', `<p class="small">${esc(name)} did not pass all checks. It has not been saved.</p>${qaTable(rep)}`, 'Save anyway (marked QA failed)');
    if (!go) return false;
    audit('Exported despite QA failure', 'file', name);
  }
  const ok = await deliver(blob, name);
  if (ok) toast((rep ? (rep.ok ? 'Quality checks passed (' + rep.checks.length + '). ' : 'Saved with QA failures. ') : '') + 'Saved ' + name + '.');

}

function deviationsAll() { return co('assessments').flatMap(a => (a.result ? a.result.rows : []).map(r => ({ ...r, a }))); }
function pkgCurrency(pk) { const p = pk && byId('projects', pk.projectId); return (p && p.currency) || 'AED'; }

  const overdue = ob.filter(o => o.dueDate && o.status !== 'Complete' && daysTo(o.dueDate) < 0);
  const pays = co('payments'), vars = co('variations'), cl = co('claims'), bc = co('backcharges'), ap = co('approvals');

  const projRows = projects.map(p => {
    const pk = pkgs.filter(x => x.projectId === p.id);

    return `<tr><td>${esc(p.number || '')}</td><td>${esc(p.name)}</td><td class="num">${pk.length}</td><td class="num">${pa.length}</td><td class="num">${crit}</td><td>${pa.filter(a => approvedForIssue('assessments', a.id)).length} approved</td></tr>`;

  return `${head('Commercial dashboard', `${esc((company() || {}).name || '')} · all figures are counted from records in this workspace.`, `<button class="btn" data-act="go" data-route="reports">Monthly commercial report</button>`)}

    ${k('Contracts under review', as.filter(a => !approvalFor('assessments', a.id)).length, 'assessment')}${k('Awaiting approval', ap.filter(a => a.coll === 'assessments' && a.status !== 'Approved for Issue' && a.status !== 'Rejected').length, 'approvals')}
    ${k('Contract deviations', devs.length, 'comparison')}${k('Critical deviations', sev('CRITICAL'), 'comparison')}${k('High-risk clauses', sev('HIGH'), 'comparison')}${k('Open clarifications', co('negotiations').filter(n => n.status !== 'Agreed' && n.status !== 'Closed').length, 'negotiation')}
    ${k('Deadlines ≤30 days', in30.length, 'obligations')}${k('Overdue obligations', overdue.length, 'obligations')}${k('Payment applications', pays.length, 'payments')}${k('Pending certification', pendingCert.length, 'payments')}

    ${k('EOT submissions', cl.filter(c => c.type !== 'Cost claim').length, 'claims')}${k('Backcharges', bc.length, 'backcharges')}${k('Final accounts pending', pkgs.filter(p => p.status !== 'Closed' && p.status !== 'Final account agreed').length, 'finalaccount')}${k('Avg. performance', avgPerf == null ? '—' : pct(avgPerf), 'performance')}

  </div>`;
};
function daysTo(d) { return Math.round((new Date(d + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5); }
function SEV_COUNTS(list) { const o = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 }; list.forEach(s => { if (o[s] != null) o[s]++; }); return o; }
function sevBar(label, c) {
  const tot = Object.values(c).reduce((a, b) => a + b, 0);
  const col = { CRITICAL: 'var(--crit)', HIGH: 'var(--high)', MEDIUM: 'var(--med)', LOW: 'var(--low)' };
  return `<div style="display:flex;flex-direction:column;gap:6px"><div class="row" style="justify-content:space-between"><b class="small">${esc(label)}</b><span class="tiny muted">${tot} item${tot === 1 ? '' : 's'}</span></div><div class="bar" role="img" aria-label="${esc(label)} severity distribution">${tot ? Object.entries(c).map(([k, v]) => v ? `<span style="width:${v / tot * 100}%;background:${col[k]}" title="${k}: ${v}"></span>` : '').join('') : ''}</div><div class="legend">${Object.entries(c).map(([k, v]) => `<span><i style="background:${col[k]}"></i>${k} ${v}</span>`).join('')}</div></div>`;
}
function statusLine(label, list, key) {
  const m = {}; list.forEach(x => { const s = x[key] || 'Not set'; m[s] = (m[s] || 0) + 1; });
  return `<div style="display:flex;flex-direction:column;gap:4px"><b class="small">${esc(label)} <span class="muted">(${list.length})</span></b><div class="chips">${Object.entries(m).map(([k, v]) => `<span class="pill">${esc(k)} · ${v}</span>`).join('') || '<span class="tiny muted">No records</span>'}</div></div>`;
}
function commercialSummaryHtml() {
  const pk = co('packages');
  if (!pk.length) return '<span class="muted small">No packages.</span>';
  const rows = pk.map(p => { const fa = finalAccountCalc(p); return { p, fa }; });
  const max = Math.max(1, ...rows.map(r => Math.max(r.fa.revised, r.fa.certifiedGross)));
  return `<div class="hbars">${rows.map(({ p, fa }) => `<div class="r"><span class="small" title="${esc(pkgLabel(p))}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><div class="track" title="Certified ${money(fa.certifiedGross)} of revised ${money(fa.revised)}"><span style="width:${fa.revised ? Math.min(100, fa.certifiedGross / fa.revised * 100) : 0}%"></span></div><span class="tiny mono num">${fa.revised ? pct(fa.certifiedGross / fa.revised * 100) : '—'}</span></div>`).join('')}</div><span class="tiny muted">Bar = latest certified gross value ÷ revised subcontract value (original + approved variations).</span>`;
}

const clauseCache = new Map();
function clausesOf(d) {

function docLabel(d) { return d ? d.title + (d.rev ? ' · Rev ' + d.rev : '') : '—'; }

// ---------- extraction pipeline ----------
const MAX_FILE = 50 * 1024 * 1024;

  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf.slice(0, 8));

    catch (e) { if (e && e.name === 'PasswordException') throw new Error(name + ': the PDF is password-protected. Remove the protection and upload again.'); throw new Error(name + ': the PDF could not be opened (' + (e.message || e.name) + '). It may be corrupted.'); }

      onProgress && onProgress(`Reading page ${i} of ${pdf.numPages}`);
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      const lines = new Map(); let vert = 0, tot = 0;
      tc.items.forEach(it => { if (!it.str) return; tot++; const t = it.transform; if (Math.abs(t[1]) > 0.5 || Math.abs(t[2]) > 0.5) vert++; const y = Math.round(t[5] / 3) * 3; if (!lines.has(y)) lines.set(y, []); lines.get(y).push({ x: t[4], w: it.width || 0, s: it.str, fs: Math.hypot(t[0], t[1]) || it.height || 10 }); });
      let text = [...lines.entries()].sort((a, b) => b[0] - a[0]).map(([, its]) => { its.sort((a, b) => a.x - b.x); let out = '', end = null; its.forEach(o => { if (end != null) out += (o.x - end > o.fs * 2.5) ? '\t' : ' '; out += o.s; end = o.x + o.w; }); return out.replace(/ +/g, ' ').trim(); }).filter(Boolean).join('\n');

// ---------- ingestion queue (recoverable) ----------
UI.queue = UI.queue || [];
let queueBusy = false;
async function handleFiles(files) {

  for (const f of files) {
    const item = { id: uid('q'), name: f.name, size: f.size, status: 'Queued', msg: '', opts, companyId: cid(), userId: (me() || {}).id, at: nowIso(), file: f };
    UI.queue.push(item);
    try { await IDB.put('queue', Object.assign({}, item, { file: f })); } catch (e) { item.msg = 'Not saved for recovery (browser storage unavailable)'; }
  }
  renderQueue(); processQueue();
}
async function processQueue() {
  if (queueBusy) return; queueBusy = true;
  try {
    for (const item of UI.queue) {
      if (!['Queued', 'Retry', 'Upload anyway'].includes(item.status)) continue;
      const force = item.status === 'Upload anyway';
      item.status = 'Processing'; renderQueue();
      let file = item.file;
      if (!file) { try { const r = await IDB.get('queue', item.id); file = r && r.file; } catch (e) { } }
      if (!file) { item.status = 'Failed'; item.msg = 'The original file is no longer available; choose it again.'; renderQueue(); continue; }
      const t0 = performance.now();
      try { await ingest(file, item.opts, m => { item.msg = m; renderQueue(); }, force); item.status = 'Done'; item.msg = 'Extracted and quality-checked'; metric('upload', true, performance.now() - t0, item.name); try { await IDB.del('queue', item.id); } catch (e) { } }

      renderQueue(); save();

}

  const dup = co('docs').find(d => d.sha256 && d.sha256 === r.sha256);

  <div class="panel"><div class="ph"><h3>Award recommendation</h3><span class="gen-label">System-generated from the scores</span></div><div class="pb">${tenderNarrative(pk, scored, W).map(p => `<p>${esc(p)}</p>`).join('')}</div></div>` : ''}` : '<div class="empty">Create a package first.</div>'}`;
};
function tenderNarrative(pk, scored, W) {
  if (!scored.length) return [];
  const nm = q => (byId('subs', q.bidder) || {}).name || 'Unknown bidder';
  const best = scored[0]; const cheapest = scored.slice().sort((a, b) => a.price - b.price)[0];
  const out = [`${scored.length} offer(s) were evaluated for ${pkgLabel(pk)} using weights of price ${W.price}%, technical ${W.technical}%, programme ${W.programme}% and compliance ${W.compliance}%.`];
  if (best.compliant) out.push(`${nm(best)} achieved the highest weighted score among compliant offers (${best.total}) at ${money(best.price)}.`);
  else out.push('No offer is fully compliant. Clarification and re-submission are recommended before award.');
  if (cheapest.id !== best.id) out.push(`The lowest price was submitted by ${nm(cheapest)} (${money(cheapest.price)}), which ranked lower because of ${cheapest.compliant ? 'its combined technical, programme and compliance scores' : cheapest.fails.join(' and ').toLowerCase()}.`);
  const unclear = scored.filter(q => q.scopeCoverage && q.scopeCoverage !== 'Full');
  if (unclear.length) out.push('Scope coverage is not confirmed as full for: ' + unclear.map(nm).join(', ') + '. Normalise these offers for scope before award.');
  out.push('Award is subject to clarification of all exclusions and qualifications, resolution of contract deviations through Contract Assessment, and approval through the Subcontract award workflow.');
  return out;
}

PAGES.boq = () => {
  const pk = curPkg('boq'); const tab = UI.tab.boq || 'boq';
  const items = pk ? co('boq').filter(b => b.packageId === pk.id) : [];
  const qs = pk ? co('quotations').filter(q => q.packageId === pk.id) : [];

  <div class="tabs">${[['boq', 'BOQ & bidder rates'], ['rate', 'Rate analysis']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-act="tab" data-page="boq" data-tab="${k}">${l}</button>`).join('')}</div>
  ${!pk ? '<div class="empty">Create a package first.</div>' : tab === 'rate' ? rateTab(items, ed) : `
  <div class="panel"><div class="ph"><h3>${items.length} item(s) · ${qs.length} bidder(s)</h3><span class="small muted">Enter bidder rates directly in the grid. Bidders come from Tender and Procurement.</span></div><div class="pb flush"><div class="tablewrap"><table><thead><tr><th class="nosort">Item</th><th class="nosort">Description</th><th class="nosort">Unit</th><th class="nosort num">Qty</th>${qs.map(q => `<th class="nosort num">${esc(((byId('subs', q.bidder) || {}).name || '?').slice(0, 18))}<div class="tiny">rate · amount</div></th>`).join('')}<th class="nosort num">Median rate</th><th class="nosort"></th></tr></thead><tbody>
  ${items.map(it => { const c = cmp.items[it.id]; return `<tr><td class="mono">${esc(it.item)}</td><td class="small"><span class="clip">${esc(it.description)}</span></td><td>${esc(it.unit)}</td><td class="num">${int(it.qty)}</td>${qs.map(q => { const r = (it.rates || {})[q.id]; const fl = c.flags[q.id]; return `<td class="num"><input type="number" step="any" value="${r ?? ''}" data-ch="boqRate" data-id="${it.id}" data-q="${q.id}" style="width:92px;text-align:right" aria-label="Rate" ${ed ? '' : 'disabled'}><div class="tiny ${fl ? 'check-bad' : 'muted'}">${r != null && r !== '' ? money(num(r) * num(it.qty)) : 'missing'}${fl ? ' · ' + fl : ''}</div></td>`; }).join('')}<td class="num">${c.median == null ? '—' : money(c.median)}</td><td>${ed ? `<button class="btn sm" data-act="regEdit" data-reg="boq" data-id="${it.id}">Edit</button>` : ''}</td></tr>`; }).join('')}
  ${items.length ? `<tr><td colspan="4"><b>Totals</b></td>${qs.map(q => `<td class="num"><b>${money(cmp.totals[q.id])}</b><div class="tiny muted">at BOQ quantities · ${cmp.missing[q.id]} unpriced</div>${(cmp.qty[q.id] || []).length ? `<div class="tiny check-bad">As priced with bidder quantities: ${money(cmp.asPriced[q.id])} · ${cmp.qty[q.id].length} quantity difference(s)</div>` : ''}${(q.extraItems || []).length ? `<div class="tiny check-bad">${q.extraItems.length} item(s) not in BOQ</div>` : ''}</td>`).join('')}<td></td><td></td></tr>` : ''}
  </tbody></table></div>${items.length ? '' : '<div class="empty">No BOQ items. Add items or import a spreadsheet with columns Item, Description, Unit, Qty (and optionally Rate).</div>'}</div></div>
  ${qs.length ? `<div class="note">Totals are normalised to the BOQ quantities so bidders compare like for like; where a bidder priced different quantities, the as-priced total and each quantity difference are flagged. Outlier rule: a rate more than 25% above or below the median of submitted rates for that item is flagged. Totals are bidder rates × BOQ quantity and can differ from the submitted lump sum where the bidder has priced differently; reconcile in the Commercial Adjustment sheet of the export.</div>` : ''}`}`;
};
function boqCompare(items, qs) {
  const res = { items: {}, totals: {}, missing: {}, asPriced: {}, qty: {} };
  qs.forEach(q => { res.totals[q.id] = 0; res.missing[q.id] = 0; res.asPriced[q.id] = 0; });
  items.forEach(it => {
    const rates = qs.map(q => (it.rates || {})[q.id]).filter(r => r !== '' && r != null).map(Number).sort((a, b) => a - b);

    const flags = {};

function agreementAutoFill(pk) {

function buildAgreement(tpl, vals, neg) {
  let text = tpl.replace(/\[\[([A-Z0-9_ ]+)\]\]|\{\{([A-Za-z0-9_ ]+)\}\}/g, (m, a, b) => { const k = (a || b).trim(); return vals[k] ? vals[k] : m; });
  const amendments = [];
  for (const n of neg) {
    if (!n.clause) continue;
    const re = new RegExp('(^|\\n)(\\s*' + String(n.clause).replace(/\./g, '\\.') + '\\.?\\s+)([^\\n]*)', 'm');
    const m = text.match(re);
    if (m) {
      const old = m[3];
      text = text.replace(re, (x, a, b) => a + b + n.agreed.replace(/\n/g, ' '));
      const ops = E.diffWords(old, n.agreed);
      amendments.push({ clause: n.clause, source: 'Agreed negotiation item ' + n.ref, diff: ops.map(o => o.op === 'eq' ? esc(o.t) : o.op === 'ins' ? `<ins>${esc(o.t)}</ins>` : `<del>${esc(o.t)}</del>`).join(' ') });
    } else {
      text += `\n\n${n.clause} ${n.agreed}`;
      amendments.push({ clause: n.clause, source: 'Agreed negotiation item ' + n.ref + ' (clause not in template, appended)', diff: `<ins>${esc(n.agreed)}</ins>` });
    }
  }
  const unfilled = (text.match(/\[\[[A-Z0-9_ ]+\]\]|\{\{[A-Za-z0-9_ ]+\}\}/g) || []);
  if (unfilled.length) amendments.push({ clause: '—', source: 'Unfilled template fields', diff: esc([...new Set(unfilled)].join(', ')) });
  return { text, amendments };
}

function addMonths(m, n) { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }

function drawCharts() {

function finalAccountCalc(pk) {
  const fa = pk.fa || {};
  const pays = co('payments').filter(p => p.packageId === pk.id && p.calc).sort((a, b) => num(b.appNo) - num(a.appNo));
  const last = pays[0];
  const original = num(pk.value), vars = approvedVariations(pk.id), revised = original + vars;
  const certifiedGross = last ? last.calc.grossCum : 0;
  const finalValuation = fa.finalMeasured !== '' && fa.finalMeasured != null ? num(fa.finalMeasured) : certifiedGross;
  const agreedClaims = co('claims').filter(c => c.packageId === pk.id && c.status === 'Agreed').reduce((s, c) => s + num(c.costAssessed), 0);
  const bcs = co('backcharges').filter(b => b.packageId === pk.id && ['Approved', 'Recovered'].includes(b.status));
  const backcharges = bcs.filter(b => b.kind !== 'Contra charge').reduce((s, b) => s + num(b.assessed || bcTotal(b)), 0);
  const contra = bcs.filter(b => b.kind === 'Contra charge').reduce((s, b) => s + num(b.assessed || bcTotal(b)), 0);
  const deductions = backcharges + contra;
  const advanceOutstanding = last ? last.calc.advanceOutstanding : num(pkgMech(pk).advance);
  const paid = co('payments').filter(p => p.packageId === pk.id).reduce((s, p) => s + num(p.paidAmount), 0);
  const mech = pkgMech(pk); const vatPct = mech.vatBasis === 'none' ? 0 : num(mech.vatPct);
  const netFinal = finalValuation + agreedClaims - deductions - advanceOutstanding;
  const netFinalVat = netFinal * (1 + vatPct / 100);
  const disputed = co('claims').filter(c => c.packageId === pk.id && c.status === 'Disputed').reduce((s, c) => s + num(c.costClaimed) - num(c.costAssessed), 0) + co('payments').filter(p => p.packageId === pk.id).reduce((s, p) => s + num(p.disputed), 0);
  const openClaims = co('claims').filter(c => c.packageId === pk.id && !['Agreed', 'Rejected', 'Closed'].includes(c.status)).length;
  return { original, vars, revised, certifiedGross, finalValuation, agreedClaims, backcharges, contra, deductions, advanceOutstanding, paid, vatPct, netFinal, netFinalVat, balance: netFinalVat - paid, retention: last ? (last.calc.retentionHeld ?? last.calc.retention) : 0, disputed, openClaims, eotCost: co('claims').filter(c => c.packageId === pk.id && c.status === 'Agreed' && c.type !== 'Cost claim').reduce((s, c) => s + num(c.costAssessed), 0) };
}

  const secs = r.sections.filter(s => levels.includes(s.slide || 'detail'));

    if (sec.kv) slides.push(() => { const s = pptx.addSlide(); hdr(s, sec.h); s.addTable(sec.kv.slice(0, 12).map(([k, v]) => [{ text: k, options: { bold: true, fill: { color: BRAND.soft } } }, String(v)]), { x: 0.5, y: 1.2, w: 12.3, fontSize: 12, border: { type: 'solid', color: BRAND.line, pt: 0.75 }, colW: [4, 8.3] }); });

  let list = slides.slice(0, max - 1);

function pptChartSlide(pptx, hdr, sec) {

function clientCanWrite(coll) {

  return can('edit', coll);
}
function collectOps() {

    const w = clientCanWrite(coll);
    S[coll].forEach(r => {
      const k = recKey(coll, r.id); seen.add(k); if (!w) return;
      if (coll === 'audit') { if (!(k in SYNC.synced)) ops.push({ coll, id: r.id, op: 'upsert', data: r, base: null, json: JSON.stringify(r) }); return; }
      const j = JSON.stringify(r); if (SYNC.synced[k] === j) return;
      ops.push({ coll, id: r.id, op: 'upsert', data: r, base: SYNC.vers[k] == null ? null : SYNC.vers[k], json: j });
    });
  });

}

  SYNC.busy = true; setSyncBadge();

    try {
      const res = await api('/sync', { body: { ops: ops.map(({ json, ...o }) => o) } });
      const byKey = new Map(ops.map(o => [recKey(o.coll, o.id), o]));
      res.applied.forEach(a => {
        const o = byKey.get(recKey(a.coll, a.id)); if (!o) return;

// ---------- pagination ----------
function ppPaginate(src, host) {
  host.innerHTML = '';
  const [W, H] = ppSize(); const sheets = []; let body = null, stack = [], leaves = 0, lastLeaf = null;
  const headTxt = PP.report ? PP.report.company + ' · ' + PP.report.title + (PP.report.approved ? '' : ' · DRAFT') : ((company() || {}).name || '') + ' · ' + PP.title;
  const newSheet = () => {
    const sh = document.createElement('section'); sh.className = 'pp-sheet'; sh.style.width = W + 'mm'; sh.style.height = H + 'mm'; sh.style.setProperty('--ph', H + 'mm'); sh.style.padding = PP_MARGIN + 'mm';
    sh.innerHTML = `${PP.header ? `<header class="pp-head"><span>${esc(headTxt)}</span><span>${esc(dshort(today()))}</span></header>` : ''}<div class="pp-body pp-doc ${PP.orient}" style="font-size:${(11.5 * PP.scale / 100).toFixed(2)}px"></div>${PP.header ? `<footer class="pp-foot"><span>${esc(PP.report ? PP.report.ref : 'Printed by ' + ((me() || {}).name || '') + ' · ' + nowIso().slice(0, 16).replace('T', ' '))}</span><span class="pp-pn"></span></footer>` : '<footer class="pp-foot"><span></span><span class="pp-pn"></span></footer>'}`;
    host.appendChild(sh); sheets.push(sh); body = sh.querySelector('.pp-body'); leaves = 0;
    let parent = body; stack.forEach(f => { f.el = f.src.cloneNode(false); f.el.dataset.ppShell = '1'; parent.appendChild(f.el); parent = f.el; });
  };
  const target = () => stack.length ? stack[stack.length - 1].el : body;
  const over = () => body.scrollHeight > body.clientHeight + 1;
  const isHeading = n => n && n.nodeType === 1 && (/^H[1-4]$/.test(n.tagName) || n.classList.contains('ph') || n.classList.contains('eyebrow') || n.classList.contains('pp-gen'));
  const breakPage = () => {
    // never leave a heading alone at the bottom of a page: carry it to the next one
    const levels = [body, ...stack.map(f => f.el)];
    const lvl = lastLeaf && isHeading(lastLeaf) && leaves > 1 ? levels.indexOf(lastLeaf.parentNode) : -1;
    const after = lvl >= 0 ? (() => { let n = lastLeaf.nextSibling; while (n) { if (n.nodeType === 1 ? (n.textContent.trim() || n.querySelector('img,svg')) : n.textContent.trim()) return true; n = n.nextSibling; } return false; })() : true;
    const carry = lvl >= 0 && !after ? lastLeaf : null;
    if (carry) carry.remove(); newSheet();
    if (carry) { const lv = [body, ...stack.map(f => f.el)][lvl]; lv.insertBefore(carry, lv.firstChild); leaves = 1; }
  };
  const atomic = n => n.nodeType !== 1 || /^(IMG|SVG|svg|CANVAS|TR|TH|TD|P|LI|H1|H2|H3|H4|B|SPAN|I|A|PRE|CODE|TEXTAREA)$/.test(n.tagName) || n.classList.contains('kpi') || n.classList.contains('pill') || n.classList.contains('pp-cover') || n.matches('.legend, .hbars .r, .pp-val');
  const leaf = n => { leaves++; lastLeaf = n; };
  const placeTable = tbl => {
    const mk = () => { const t = tbl.cloneNode(false); t.dataset.ppShell = '1'; if (tbl.tHead) t.appendChild(tbl.tHead.cloneNode(true)); const tb = document.createElement('tbody'); t.appendChild(tb); target().appendChild(t); return tb; };
    const rows = [...tbl.querySelectorAll(':scope > tbody > tr, :scope > tr')]; let tb = mk(); let n = 0;
    if (over() && leaves) { tb.parentNode.remove(); breakPage(); tb = mk(); }
    rows.forEach(r => {
      tb.appendChild(r);
      if (over()) {
        if (n > 0) { r.remove(); newSheet(); tb = mk(); tb.appendChild(r); n = 0; }
        else if (leaves) { tb.parentNode.remove(); breakPage(); tb = mk(); tb.appendChild(r); }
      }
      n++; leaf(r);
    });
  };
  const place = node => {
    if (node.nodeType === 3 && !node.textContent.trim()) return;
    if (node.nodeType === 1 && node.classList.contains('pp-break')) { if (leaves) newSheet(); return; }
    const t = target(); t.appendChild(node);
    if (!over()) { if (node.nodeType !== 1 || atomic(node) || !node.children.length) leaf(node); else { leaves++; lastLeaf = node.lastElementChild || node; } return; }
    const tall = node.nodeType === 1 ? node.getBoundingClientRect().height : 0;
    node.remove();
    // keep cards and panels together when they fit on a fresh page
    if (node.nodeType === 1 && leaves && node.matches('.panel, .chartcard, .kpi, .pp-keep') && tall <= body.clientHeight - 8) { breakPage(); target().appendChild(node); if (!over()) { leaves++; lastLeaf = node; return; } node.remove(); }
    if (node.nodeType === 1 && node.tagName === 'TABLE') return placeTable(node);
    if (atomic(node) || !node.childNodes.length) {
      if (leaves) { breakPage(); target().appendChild(node); if (!over()) return leaf(node); node.remove(); }
      if (node.nodeType === 1) { node.classList.add('pp-shrink'); target().appendChild(node); const room = body.getBoundingClientRect().bottom - node.getBoundingClientRect().top - 4; node.style.maxHeight = Math.max(40, room) + 'px'; node.style.overflow = 'hidden'; if (node.tagName === 'IMG' || node.tagName.toLowerCase() === 'svg') { node.style.width = 'auto'; node.style.maxWidth = '100%'; } } else target().appendChild(node);
      return leaf(node);
    }
    const shell = node.cloneNode(false); shell.dataset.ppShell = '1'; t.appendChild(shell); stack.push({ src: node, el: shell });
    [...node.childNodes].forEach(ch => place(ch)); stack.pop();
  };
  newSheet(); [...src.cloneNode(true).childNodes].forEach(place);
  sheets.forEach(sh => { [...sh.querySelectorAll('[data-pp-shell]')].reverse().forEach(e => { if (!e.textContent.trim() && !e.querySelector('img,svg,canvas,hr')) e.remove(); }); });
  const real = sheets.filter(sh => sh.querySelector('.pp-body').textContent.trim() || sh.querySelector('.pp-body img, .pp-body svg'));
  sheets.filter(sh => !real.includes(sh)).forEach(sh => sh.remove());
  real.forEach((sh, i) => { sh.querySelector('.pp-pn').textContent = 'Page ' + (i + 1) + ' of ' + real.length; });
  return real.length;
}

  root = document.createElement('div'); root.id = 'ppRoot'; root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-label', 'Print preview');

    <label class="small">Orientation <select data-pp="orient"><option value="portrait" ${PP.orient === 'portrait' ? 'selected' : ''}>Portrait</option><option value="landscape" ${PP.orient === 'landscape' ? 'selected' : ''}>Landscape</option></select></label>
    <label class="small">Scale <select data-pp="scale">${[70, 80, 90, 100, 110].map(s => `<option value="${s}" ${PP.scale === s ? 'selected' : ''}>${s}%</option>`).join('')}</select></label>
    <label class="small"><input type="checkbox" data-pp="header" ${PP.header ? 'checked' : ''}> Header &amp; footer</label>
    ${report ? `<label class="small"><input type="checkbox" data-pp="charts" ${PP.charts ? 'checked' : ''}> Charts</label>` : ''}
    <span class="small muted pp-count" role="status"></span>
    <button class="btn pri" data-ppact="print">Print</button><button class="btn" data-ppact="pdf">Download PDF</button><button class="btn" data-ppact="close" aria-label="Close preview">Close</button></div>
    <div class="pp-pages" tabindex="0"></div>`;
  document.body.appendChild(root); document.body.classList.add('pp-open');
  root.addEventListener('change', e => { const k = e.target.dataset.pp; if (!k) return; PP[k] = e.target.type === 'checkbox' ? e.target.checked : (k === 'scale' ? +e.target.value : e.target.value); ppRender(); });
  root.addEventListener('click', e => { const a = e.target.closest('[data-ppact]'); if (!a) return; ({ print: ppPrint, pdf: ppPdf, close: ppClose })[a.dataset.ppact](); });
  root.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); ppClose(); } });

}
async function ppRender() {
  const host = $('#ppRoot .pp-pages'); const src = PP.report ? ppFromReport(PP.report) : PP.src;
  // images must have their size before pagination: decode them and record their natural dimensions
  await Promise.all([...src.querySelectorAll('img')].map(async im => { try { await im.decode(); } catch (e) { } if (im.naturalWidth) { im.setAttribute('width', im.naturalWidth); im.setAttribute('height', im.naturalHeight); } }));
  if (!$('#ppRoot')) return;
  const t0 = performance.now(); const n = ppPaginate(src, host);
  $('#ppRoot .pp-count').textContent = n + ' page' + (n === 1 ? '' : 's') + ' · ' + PP.paper + ' ' + PP.orient;
  let st = $('#ppPageStyle'); if (!st) { st = document.createElement('style'); st.id = 'ppPageStyle'; document.head.appendChild(st); }
  const [W, H] = ppSize(); st.textContent = `@page { size: ${W}mm ${H}mm; margin: 0; }`;
  metric('print', true, performance.now() - t0, n + ' pages');
}
function ppClose() { const r = $('#ppRoot'); if (r) r.remove(); document.body.classList.remove('pp-open'); const st = $('#ppPageStyle'); if (st) st.remove(); }
function ppPrint() {
  document.body.classList.add('pp-printing');
  const done = () => { document.body.classList.remove('pp-printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  try { window.print(); } catch (e) { done(); toast('This browser view blocked printing. Use Download PDF instead.', true); return; }
  setTimeout(() => { if (document.body.classList.contains('pp-printing')) done(); }, 1500);
  audit('Printed', PP.kind, PP.title);
}
function ppCss() { return [...document.querySelectorAll('style')].map(s => s.textContent).join('\n'); }
function ppSheetPng(sheet, pxW, pxH) {
  return new Promise((res, rej) => {
    const css = ppCss().replace(/@import[^;]+;/g, '');
    const html = `<div xmlns="http://www.w3.org/1999/xhtml" class="pp-svgwrap"><style>${css.replace(/<\/style/gi, '')}</style>${new XMLSerializer().serializeToString(sheet)}</div>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${pxW}" height="${pxH}"><foreignObject x="0" y="0" width="${pxW}" height="${pxH}">${html}</foreignObject></svg>`;
    const img = new Image(); img.onload = () => { try { const c = document.createElement('canvas'); c.width = pxW * 2; c.height = pxH * 2; const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.scale(2, 2); g.drawImage(img, 0, 0); res(c.toDataURL('image/jpeg', 0.92)); } catch (e) { rej(e); } };
    img.onerror = () => rej(new Error('Could not render the page image')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function ppPdf() {
  try {
    await busy('Building PDF…', async () => {
      await need('jspdf'); const [W, H] = ppSize(); const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: [W, H], orientation: PP.orient });
      const sheets = [...$$('#ppRoot .pp-sheet')]; const pxW = Math.round(W * 96 / 25.4), pxH = Math.round(H * 96 / 25.4);
      for (let i = 0; i < sheets.length; i++) { if (i) doc.addPage([W, H], PP.orient); doc.addImage(await ppSheetPng(sheets[i], pxW, pxH), 'JPEG', 0, 0, W, H); }
      const name = (PP.report ? PP.report.title : PP.title).replace(/[^\w\- ]+/g, '').replace(/\s+/g, '_').slice(0, 60) + '_' + today() + '.pdf';
      await saveBlob(doc.output('blob'), name);
    });
  } catch (e) { toast('PDF could not be built: ' + e.message, true); }
}
function printPreviewPage() {
  const src = ppFromPage(); if (!src) return;
  const h1 = $('#page h1'); return ppOpen('screen', src, h1 ? h1.textContent.trim() : 'Screen', null);
}
async function printPreviewReport(r) {
  if (r.sections.some(s => s.chartDef && !s.img) && UI.dashA) await busy('Rendering charts…', () => prepareChartImages(r, UI.dashA));
  return ppOpen('report', null, r.title, r);
}

async function ppTest(T) {
  try {
    const r = reportBase('Print preview test', 'Test', [], false);
    r.sections.push({ h: 'Long table', table: { head: ['#', 'Item', 'Amount'], rows: Array.from({ length: 160 }, (_, i) => [i + 1, 'Line item ' + (i + 1), money(1000 + i)]) } }, { h: 'Text', paras: Array.from({ length: 30 }, (_, i) => 'Paragraph ' + (i + 1) + ' of the print preview test.') });
    const res = [];
    for (const [paper, orient] of [['A4', 'portrait'], ['A4', 'landscape'], ['Letter', 'portrait']]) {
      PP.paper = paper; PP.orient = orient; await ppOpen('report', null, r.title, r);
      const sheets = $$('#ppRoot .pp-sheet'); const over = [...$$('#ppRoot .pp-body')].filter(b => b.scrollHeight > b.clientHeight + 1).length;
      const rowsShown = [...$$('#ppRoot .pp-table')].filter(t => [...t.querySelectorAll('thead th')].some(th => th.textContent === 'Item')).reduce((n, t) => n + t.querySelectorAll('tbody tr').length, 0);
      const heads = [...$$('#ppRoot .pp-sheet')].filter(sh => [...sh.querySelectorAll('thead th')].some(th => th.textContent === 'Item')).length;
      const pn = sheets.length && sheets[sheets.length - 1].querySelector('.pp-pn').textContent === 'Page ' + sheets.length + ' of ' + sheets.length;
      res.push({ paper, orient, pages: sheets.length, over, rowsShown, heads, pn }); ppClose();
    }
    PP.paper = 'A4'; PP.orient = 'portrait';
    const ok = res.every(x => x.pages >= 3 && x.over === 0 && x.rowsShown === 160 && x.heads >= 2 && x.pn);
    T(81, 'Print preview paginates reports without clipping, repeats table headers and numbers pages', ok, res.map(x => `${x.paper} ${x.orient}: ${x.pages} pages, ${x.rowsShown}/160 rows, header on ${x.heads} pages, ${x.over} overflowing`).join('; '));
  } catch (e) { ppClose(); T(81, 'Print preview paginates reports without clipping, repeats table headers and numbers pages', false, e.message); }
}

document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && TYPING.includes(el.dataset.ch)) return; onCh(e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-ch]'); if (el && TYPING.includes(el.dataset.ch)) onCh(e); });
